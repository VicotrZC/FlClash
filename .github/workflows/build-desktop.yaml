name: build-desktop

# 上游 build.yaml 的 build/upload job 带 `github.repository == 'chen08209/FlClash'`
# 条件，在 fork 上永远被跳过，所以这里单独构建桌面端并发 Release。

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '构建哪些平台'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - windows,linux
          - windows,linux,macos
  push:
    branches:
      - 'vpncheap*'
    paths:
      - 'lib/**'
      - 'desktop/**'
      - 'windows/**'
      - 'linux/**'
      - 'macos/**'
      - 'core/**'
      - 'plugins/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'setup.dart'
      - '.github/workflows/build-desktop.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'

jobs:
  desktop:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2022
            artifact: windows-amd64
          - platform: linux
            os: ubuntu-22.04
            artifact: linux-amd64
          - platform: macos
            os: macos-15-intel
            artifact: macos-amd64
    steps:
      - name: Skip unrequested platform
        id: gate
        shell: bash
        run: |
          wanted="${{ github.event.inputs.platforms || 'windows' }}"
          if echo ",$wanted," | grep -q ",${{ matrix.platform }},"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "跳过 ${{ matrix.platform }}（本次只构建 $wanted）"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            plugins/setup/setup_hooks/lib/src/go_builder.dart

      - name: Setup Rust cache
        if: steps.gate.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.platform }}
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        if: steps.gate.outputs.run == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        if: steps.gate.outputs.run == 'true' && matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev

      - name: Setup Xcode
        if: steps.gate.outputs.run == 'true' && matrix.platform == 'macos'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Enable git long paths (Windows)
        if: steps.gate.outputs.run == 'true' && matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: flutter pub get


      - name: Flutter version
        if: steps.gate.outputs.run == 'true'
        run: flutter --version

      # 与上游 build.yaml 的 release 矩阵一致：用 setup.dart 打包。
      # windows 出 exe+zip，linux 出 deb/appimage/rpm，macos 出 dmg。
      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: dart setup.dart ${{ matrix.platform }} --env stable -v

      - name: List artifacts
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: ls -lhR dist/ | head -60

      - name: Upload artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flclash-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish release
    needs: [desktop]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Show what we got
        run: find release-assets -type f | head -40 && du -sh release-assets

      - name: Tag name
        id: tag
        run: echo "tag=desktop-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            FlClash v0.9.2 + vpncheap 订阅支持（桌面端自动构建）

            包含改动：
            - 订阅正文解密（响应头 `X-Encrypted: 1`，AES-256-CBC）
            - 每个订阅独立的 User-Agent 与自定义请求头
            - sing-box JSON 订阅自动转 Clash YAML

            构建环境：Flutter ${{ env.FLUTTER_VERSION }} / Go ${{ env.GO_VERSION }}
            提交：${{ github.sha }}

            安装说明：未配置正式签名密钥，因此使用 debug 签名。
            Windows 使用 `windows-amd64` 的 exe 或 zip。
          files: release-assets/**
          fail_on_unmatched_files: false
